services:
  postgres:
    image: postgres:16
    container_name: time-app-db
    environment:
      POSTGRES_USER: timeapp
      POSTGRES_PASSWORD: timeapp_pass
      POSTGRES_DB: timeapp
    ports:
      - "5432:5432"
    volumes:
      - ./import:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: