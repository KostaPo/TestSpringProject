server:
  port: 8888
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/timeapp
    username: timeapp
    password: timeapp_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    user:
      name: admin
      password: admin